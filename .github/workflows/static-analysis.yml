name: Static Analysis

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /root/local-photo-sync

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: /root/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Compile
        run: mvn clean compile -q

      - name: SpotBugs Check
        run: mvn spotbugs:check -q

      - name: Checkstyle Check
        run: mvn checkstyle:check -q

      - name: PMD Check
        run: mvn pmd:check -q

      - name: JaCoCo Report
        run: mvn jacoco:report -q

      - name: Upload Reports
        uses: actions/upload-artifact@v3
        with:
          name: static-analysis-reports
          path: |
            target/site/spotbugs/
            target/site/checkstyle/
            target/site/pmd/
            target/site/jacoco/
